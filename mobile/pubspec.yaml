name: productive_ai
description: AI Productivity Tracker Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_local_notifications: ^17.2.4
  vibration: ^3.1.3
  audioplayers: ^6.5.1

  # Icons
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.4.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.2.0

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  table_calendar: ^3.1.0
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.5.3

  # New packages
  share_plus: ^12.0.0
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/avatars/
