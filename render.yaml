services:
  - type: web
    name: ai-productivity-backend
    env: python
    rootDir: server
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "gunicorn server.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
